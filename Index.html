<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Departamental - Projetos</title>

    <Style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            font-family: sans-serif;

        }

        header{
            width: 100%;
            background-color: #000000;
            padding: 16px 32px;
            display: flex;
            align-items: center;
        }

        header a {
            color: #00ff00;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .content-box{
            width: calc(100% - 48px);
            max-width: 1200px;
            height: 60vh;
            margin: 24px;

            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;

            display: flex;
            align-items: center;
            text-align: center;
            flex-grow: 1;
        }

        footer {
            width: 100%;
            background-color: #222222;
            color: #ffffff;
            text-align: center;
            padding: 16px;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </Style>

</head>

<body>

    <header>
        <a href="Index.html">Visão Júnior</a>
    </header>

    <main class="content-box">
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Laborum, eum. Iusto, iure magnam quisquam quo quod assumenda, iste culpa tempore autem qui commodi vitae alias perferendis, quibusdam ad cupiditate pariatur?</p>
    </main>

    <footer>
        All Rights Reserved
    </footer>

</body>

</html>
